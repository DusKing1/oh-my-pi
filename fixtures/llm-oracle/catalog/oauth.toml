# Provider login constants extracted from packages/ai/src/registry/oauth in pi.
# Secrets below are public installed-application credentials already embedded in
# the upstream clients, not deploy-time service credentials.

[[provider]]
provider = "anthropic"
credential_provider = "anthropic"
kind = "pkce"
client_id = "<redacted-client-id>"
authorize_url = "https://claude.ai/oauth/authorize"
token_url = "https://api.anthropic.com/v1/oauth/token"
scopes = [
	"org:create_api_key",
	"user:profile",
	"user:inference",
	"user:sessions:claude_code",
	"user:mcp_servers",
	"user:file_upload",
]
callback_port = 54545
extra_auth_params = { code = "true", callback_host = "localhost", callback_path = "/callback", token_encoding = "json", refresh_beta = "oauth-2025-04-20", refresh_user_agent = "anthropic-sdk-typescript/0.94.0 userOAuthProvider" }

[[provider]]
provider = "openai-codex"
credential_provider = "openai-codex"
kind = "pkce"
client_id = "<redacted-client-id>"
authorize_url = "https://auth.openai.com/oauth/authorize"
token_url = "https://auth.openai.com/oauth/token"
scopes = ["openid", "profile", "email", "offline_access", "api.connectors.read", "api.connectors.invoke"]
callback_port = 1455
extra_auth_params = { id_token_add_organizations = "true", codex_cli_simplified_flow = "true", originator = "omp", callback_host = "localhost", callback_path = "/auth/callback" }
exchange = "open-ai-codex-claims"

[[provider]]
