credential_provider = "google-gemini-cli"
kind = "pkce"
client_id = "<redacted-client-id>"
authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
scopes = [
	"https://www.googleapis.com/auth/cloud-platform",
	"https://www.googleapis.com/auth/userinfo.email",
	"https://www.googleapis.com/auth/userinfo.profile",
]
callback_port = 8085
extra_auth_params = { access_type = "offline", prompt = "consent", callback_host = "127.0.0.1", callback_path = "/oauth2callback", client_secret = "<redacted-client-secret>" }

[[provider]]
