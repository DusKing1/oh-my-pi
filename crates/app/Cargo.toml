[package]
name = "omp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Production command-line application and daemon for OMP inference"
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "omp"
path = "src/main.rs"

[features]
default = []
local = ["omp-llm-inference/local"]
local-applefm = ["local", "omp-llm-inference/local-applefm"]
local-embedding = ["local", "omp-llm-inference/local-embedding"]
local-text = ["local", "omp-llm-inference/local-text"]
local-stt = ["local", "omp-llm-inference/local-stt"]
local-tts = ["local", "omp-llm-inference/local-tts"]

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
clap.workspace = true
flume.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
libc.workspace = true
omp-agent.workspace = true
omp-core.workspace = true
omp-docserver.workspace = true
omp-env.workspace = true
omp-hashline.workspace = true
omp-llm-catalog.workspace = true
omp-llm-inference.workspace = true
omp-proto = { workspace = true, features = ["tonic"] }
omp-py.workspace = true
omp-rpc.workspace = true
omp-storage.workspace = true
omp-shell-engine.workspace = true
omp-telemetry.workspace = true
omp-tool.workspace = true
omp-tui.workspace = true
omp-slopjson.workspace = true
omp-tools.workspace = true
omp-walker.workspace = true
nix.workspace = true
parking_lot.workspace = true
pyo3.workspace = true
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
ulid.workspace = true
zeroize.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
flume = { workspace = true }
omp-llm-inference = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tonic-health.workspace = true
