[package]
name = "omp-llm-local"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Async local inference for text, embeddings, speech, and Apple Foundation Models"

[lints]
workspace = true

[features]
default = []
cuda = [
	"candle-core/cuda",
	"candle-nn/cuda",
	"llama-cpp-2/cuda",
	"ort/cuda",
	"whisper-rs/cuda",
]

[dependencies]
async-stream.workspace = true
blake3.workspace = true
bytes.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
xutf.workspace = true
fastembed.workspace = true
flume.workspace = true
futures.workspace = true
hf-hub.workspace = true
llama-cpp-2.workspace = true
omp-llm-fm.workspace = true
omp-llm-transport.workspace = true
omp-llm-types.workspace = true
omp-core.workspace = true
ort.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
sherpa-onnx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
voice-g2p.workspace = true
omp-voice-kokoro.workspace = true
whisper-rs = { workspace = true, features = ["tracing_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
llama-cpp-2 = { workspace = true, features = ["metal"] }
ort = { workspace = true, features = ["coreml"] }
whisper-rs = { workspace = true, features = ["metal"] }
